# Ullavox — End-User Compose File
#
# This file is for end users who want to run Ullavox without cloning the repo.
# It pulls the pre-built image from Docker Hub and automatically downloads
# the default AI model on first run.
#
# Usage:
#   curl -fsSL https://raw.githubusercontent.com/manojisnow/ullavox/v1.6.0/docker-compose.release.yml \
#     -o docker-compose.ullavox.yml
#   docker compose -f docker-compose.ullavox.yml up
#
# Open http://localhost:8080 — no further configuration needed.
# The AI model (~2.1 GB) is downloaded once and cached in a Docker volume.

services:

  # ── Ollama AI engine ─────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${ULLAVOX_BIND_ADDRESS:-127.0.0.1}:11434:11434"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── One-time model bootstrap (runs once, then exits) ─────────────────────────
  # Pulls the default model into the shared ollama_data volume.
  # On subsequent runs the model is already cached — this exits immediately.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-granite4:3b}"]
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  # ── Ullavox application (frontend + backend in one image) ───────────────────────
  app:
    image: dumanoj/ullavox:1.6.0
    ports:
      - "${ULLAVOX_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-legacy}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite4:3b}
      - OLLAMA_API_TEMPERATURE=${OLLAMA_API_TEMPERATURE:-0.7}
      - PORT=8080
      - CORS_ALLOWED_ORIGINS=http://localhost:8080
    volumes:
      - ullavox_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  # Model weights are cached here — survives container restarts and upgrades.
  # Remove this volume only if you want to force a fresh model download.
  ollama_data:
  # Conversation history (SQLite DB) — survives restarts and upgrades.
  ullavox_data:
