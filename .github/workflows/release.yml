name: Release

# Triggers when a version tag is pushed, e.g. git tag v1.0.0 && git push --tags.
# Also runnable manually (workflow_dispatch) to re-sync Docker Hub metadata/images
# for the current tag without cutting a new release.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Required secrets (set in GitHub → Settings → Secrets → Actions):
#   DOCKERHUB_USERNAME  →  dumanoj
#   DOCKERHUB_TOKEN     →  Docker Hub access token (Account Settings → Security)

# Least-privilege default; the `publish` job below elevates to contents:write
# for the jobs that actually need it (creating the GitHub Release).
permissions:
  contents: read

jobs:

  # ── Quality gates (mirrors CI — must pass before publishing) ─────────────────

  hadolint:
    name: Dockerfile Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Hadolint on Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  backend:
    name: Java Backend Build & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build, test & quality gates
        run: |
          cd backend
          mvn clean verify
      - name: Upload static analysis reports
        uses: actions/upload-artifact@v4
        with:
          name: static-analysis-reports
          path: |
            backend/chatapp/target/checkstyle-result.xml
            backend/chatapp/target/pmd.xml
            backend/chatapp/target/spotbugsXml.xml
            backend/chatapp/target/jacoco.xml

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run tests
        run: cd frontend && npm test -- --coverage
      - name: Build frontend
        run: cd frontend && npm run build

  # ── Publish to Docker Hub & create GitHub Release ────────────────────────────

  publish:
    name: Publish Docker Image & Create Release
    needs: [hadolint, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create GitHub Releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Enables multi-platform builds and layer caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Produces tags:  dumanoj/ullavox:1.2.3  dumanoj/ullavox:1.2  dumanoj/ullavox:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: dumanoj/ullavox
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Ullavox
            org.opencontainers.image.description=AI chat application powered by Ollama

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64/v8
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Re-use cached layers from previous releases to speed up builds
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub Description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: dumanoj/ullavox
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./README.md

      # Only meaningful on an actual tag push — a workflow_dispatch run (used to
      # re-sync Docker Hub metadata/images without cutting a release) has no tag.
      - name: Prepare curated release notes
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          notes="docs/releases/$RELEASE_TAG.md"
          if [ -f "$notes" ]; then
            cp "$notes" "$RUNNER_TEMP/ullavox-release-notes.md"
          else
            printf '## Install\n\nDownload the Compose file from https://github.com/manojisnow/ullavox/blob/%s/docker-compose.release.yml and run `docker compose -f docker-compose.ullavox.yml up -d`. See README.md for configuration instructions.\n' "$RELEASE_TAG" > "$RUNNER_TEMP/ullavox-release-notes.md"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: docker-compose.release.yml
          generate_release_notes: true
          body_path: ${{ runner.temp }}/ullavox-release-notes.md
