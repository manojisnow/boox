name: Secret scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
          # Official linux_x64 release archive checksum; update with the version.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/ullavox-gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/ullavox-gitleaks" gitleaks

      - name: Scan complete Git history
        run: |
          "$RUNNER_TEMP/ullavox-gitleaks/gitleaks" git . \
            --log-opts="--all --full-history -m" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --no-banner \
            --exit-code=1
