# Server configuration
server.port=8080

# Ollama configuration
ollama.api.url=http://host.docker.internal:11434

# Ollama Configuration
ollama.model=${OLLAMA_MODEL:granite4:3b}
ollama.api.temperature=${OLLAMA_API_TEMPERATURE:0.7}
ollama.api.tags-path=/api/tags
ollama.api.chat-path=/api/chat
ollama.model.description=Ollama model

# Context window management
ollama.context.max-tokens=${OLLAMA_CONTEXT_MAX_TOKENS:3000}
ollama.context.summary.enabled=${OLLAMA_CONTEXT_SUMMARY_ENABLED:true}
ollama.context.num-ctx=${OLLAMA_CONTEXT_NUM_CTX:0}

# CORS Configuration
chat.cors.allowed-origins=http://localhost:3001,http://localhost:3000
chat.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS,HEAD
chat.cors.allowed-headers=*
chat.cors.allow-credentials=true
chat.cors.max-age=3600

# Actuator endpoints for health checks
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Persistence (SQLite file lives under /app/data — mount as a volume to survive restarts)
spring.datasource.url=jdbc:sqlite:${ULLAVOX_DB_PATH:/app/data/ullavox.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=com.example.chatapp.persistence.UllavoxSqliteDialect
spring.jpa.open-in-view=false

# Jackson Configuration
spring.jackson.serialization.FAIL_ON_EMPTY_BEANS=false

# Logging
logging.level.org.springframework=INFO
# Foreign keys are enabled on every application connection; migrations use a dedicated connection.
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON
