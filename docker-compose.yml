services:
  app:
    image: ${ULLAVOX_IMAGE:-ullavox:local}
    build: .
    ports:
      - "${ULLAVOX_BIND_ADDRESS:-127.0.0.1}:3000:3000"
      - "${ULLAVOX_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      - OLLAMA_API_URL=http://ollama:11434
      - WEB_SEARCH_PROVIDER=${WEB_SEARCH_PROVIDER:-legacy}
      - PARALLEL_API_KEY=${PARALLEL_API_KEY:-}
      - BRAVE_SEARCH_API_KEY=${BRAVE_SEARCH_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_SEARCH_ENGINE_ID=${GOOGLE_SEARCH_ENGINE_ID:-}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite4:3b}
      - OLLAMA_API_TEMPERATURE=0.7
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
      - PORT=8080
      - chat.cors.allowed-origins=http://localhost:3000
      - chat.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - chat.cors.allowed-headers=*
      - chat.cors.allow-credentials=true
    volumes:
      - ullavox_data:/app/data
    depends_on:
      - ollama

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "${ULLAVOX_BIND_ADDRESS:-127.0.0.1}:11434:11434"
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    environment:
      - OLLAMA_MODEL=${OLLAMA_MODEL:-granite4:3b}

volumes:
  ollama_data:
  ullavox_data:
